<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博士论文研究架构可视化</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        // Tab Component
        const TabButton = ({ active, onClick, children }) => (
            <button
                onClick={onClick}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-all ${
                    active 
                        ? 'bg-blue-600 text-white shadow-md' 
                        : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'
                }`}
            >
                {children}
            </button>
        );

        // 视图1: 研究整体架构流程图
        const OverallFlowchart = () => (
            <div className="p-6">
                <h2 className="text-xl font-bold text-center text-gray-800 mb-6">研究整体架构流程图</h2>
                
                {/* 第一层：理论来源 */}
                <div className="flex justify-center gap-4 mb-4">
                    <div className="bg-purple-100 border-2 border-purple-300 rounded-lg p-3 text-center w-36">
                        <div className="text-xs text-purple-600 font-medium">理论来源</div>
                        <div className="font-bold text-purple-800">Langacker</div>
                        <div className="text-xs text-purple-600">认知语法</div>
                    </div>
                    <div className="bg-blue-100 border-2 border-blue-400 rounded-lg p-3 text-center w-36">
                        <div className="text-xs text-blue-600 font-medium">核心主干</div>
                        <div className="font-bold text-blue-800">Sullivan</div>
                        <div className="text-xs text-blue-600">隐喻构式理论</div>
                    </div>
                    <div className="bg-green-100 border-2 border-green-300 rounded-lg p-3 text-center w-36">
                        <div className="text-xs text-green-600 font-medium">网络扩展</div>
                        <div className="font-bold text-green-800">Goldberg</div>
                        <div className="text-xs text-green-600">构式语法</div>
                    </div>
                </div>
                
                {/* 箭头 */}
                <div className="flex justify-center mb-4">
                    <div className="text-3xl text-gray-400">↓</div>
                </div>
                
                {/* 第二层：CFMC框架 */}
                <div className="flex justify-center mb-4">
                    <div className="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl p-4 text-white text-center shadow-lg w-96">
                        <div className="text-sm opacity-80">本研究理论框架</div>
                        <div className="text-xl font-bold">CFMC</div>
                        <div className="text-sm opacity-80">隐喻构式认知框架</div>
                        <div className="mt-2 flex justify-center gap-2 flex-wrap">
                            <span className="bg-white/20 px-2 py-1 rounded text-xs">自主-依存原则</span>
                            <span className="bg-white/20 px-2 py-1 rounded text-xs">四阶段机制</span>
                            <span className="bg-white/20 px-2 py-1 rounded text-xs">双维度分类</span>
                        </div>
                    </div>
                </div>
                
                {/* 箭头 */}
                <div className="flex justify-center mb-4">
                    <div className="text-3xl text-gray-400">↓</div>
                </div>
                
                {/* 第三层：三个研究问题 */}
                <div className="flex justify-center items-start gap-4 mb-4 flex-wrap">
                    {/* Q1 */}
                    <div className="flex flex-col items-center">
                        <div className="bg-amber-100 border-2 border-amber-400 rounded-lg p-3 text-center w-44">
                            <div className="text-amber-600 font-bold">Q1 类型体系</div>
                            <div className="text-xs text-amber-700 mt-1">汉语系表隐喻构式呈现怎样的类型体系？</div>
                        </div>
                        <div className="mt-2 space-y-1">
                            <div className="bg-amber-50 border border-amber-200 rounded px-2 py-1 text-xs text-center">
                                H1-1 认知分工原则
                            </div>
                            <div className="bg-amber-50 border border-amber-200 rounded px-2 py-1 text-xs text-center">
                                H1-2 12类构式+原型梯度
                            </div>
                        </div>
                    </div>
                    
                    {/* Q1→Q3 核心轴箭头 */}
                    <div className="flex flex-col items-center justify-center h-32">
                        <div className="text-xs text-gray-500 mb-1">核心轴</div>
                        <div className="text-2xl text-red-400">→</div>
                    </div>
                    
                    {/* Q3 */}
                    <div className="flex flex-col items-center">
                        <div className="bg-rose-100 border-2 border-rose-400 rounded-lg p-3 text-center w-44">
                            <div className="text-rose-600 font-bold">Q3 认知机制</div>
                            <div className="text-xs text-rose-700 mt-1">共享怎样的四阶段认知编码机制？</div>
                        </div>
                        <div className="mt-2 space-y-1">
                            <div className="bg-rose-50 border border-rose-200 rounded px-2 py-1 text-xs text-center">
                                H3-1 机制验证+共享性
                            </div>
                            <div className="bg-rose-50 border border-rose-200 rounded px-2 py-1 text-xs text-center">
                                H3-2 双维度与四阶段关联
                            </div>
                        </div>
                    </div>
                </div>
                
                {/* Q2 横向扩展 */}
                <div className="flex justify-center mb-6">
                    <div className="flex flex-col items-center">
                        <div className="flex items-center gap-2 text-xs text-gray-500 mb-1">
                            <span>横向扩展</span>
                        </div>
                        <div className="bg-teal-100 border-2 border-teal-400 rounded-lg p-3 text-center w-44">
                            <div className="text-teal-600 font-bold">Q2 网络组织</div>
                            <div className="text-xs text-teal-700 mt-1">构式如何组织成网络？</div>
                        </div>
                        <div className="mt-2">
                            <div className="bg-teal-50 border border-teal-200 rounded px-2 py-1 text-xs text-center">
                                H2 小世界性质+四类链接
                            </div>
                        </div>
                        <div className="flex mt-2 gap-8">
                            <div className="flex flex-col items-center">
                                <span className="text-teal-400">↖</span>
                                <span className="text-xs text-gray-400">节点来源</span>
                            </div>
                            <div className="flex flex-col items-center">
                                <span className="text-teal-400">↗</span>
                                <span className="text-xs text-gray-400">网络视角</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                {/* 箭头 */}
                <div className="flex justify-center mb-4">
                    <div className="text-3xl text-gray-400">↓</div>
                </div>
                
                {/* 第四层：验证章节 */}
                <div className="flex justify-center gap-4 mb-4 flex-wrap">
                    <div className="bg-amber-50 border border-amber-300 rounded-lg p-2 text-center w-32">
                        <div className="font-medium text-amber-700">第5章</div>
                        <div className="text-xs text-amber-600">Q1验证</div>
                    </div>
                    <div className="bg-teal-50 border border-teal-300 rounded-lg p-2 text-center w-32">
                        <div className="font-medium text-teal-700">第6章</div>
                        <div className="text-xs text-teal-600">Q2验证</div>
                    </div>
                    <div className="bg-rose-50 border border-rose-300 rounded-lg p-2 text-center w-32">
                        <div className="font-medium text-rose-700">第7章</div>
                        <div className="text-xs text-rose-600">Q3验证</div>
                    </div>
                </div>
                
                {/* 箭头 */}
                <div className="flex justify-center mb-4">
                    <div className="text-3xl text-gray-400">↓</div>
                </div>
                
                {/* 第五层：综合讨论与结论 */}
                <div className="flex justify-center">
                    <div className="bg-gray-100 border-2 border-gray-300 rounded-xl p-4 text-center w-80">
                        <div className="font-bold text-gray-700">第8章 综合讨论</div>
                        <div className="text-sm text-gray-600 mt-1">发现整合 · Sullivan验证与扩展 · 理论对话</div>
                        <div className="mt-2 pt-2 border-t border-gray-300">
                            <div className="font-bold text-gray-700">第9章 结论</div>
                        </div>
                    </div>
                </div>
            </div>
        );

        // 视图2: CFMC框架结构图
        const CFMCStructure = () => (
            <div className="p-6">
                <h2 className="text-xl font-bold text-center text-gray-800 mb-6">CFMC框架三层结构</h2>
                
                <div className="max-w-2xl mx-auto">
                    {/* 核心层 */}
                    <div className="relative">
                        <div className="bg-gradient-to-r from-blue-600 to-blue-700 rounded-xl p-6 text-white shadow-lg">
                            <div className="text-center">
                                <div className="text-sm opacity-80">第一层：核心主干</div>
                                <div className="text-2xl font-bold mt-1">Sullivan 自主-依存原则</div>
                                <div className="mt-3 grid grid-cols-2 gap-3">
                                    <div className="bg-white/20 rounded-lg p-3">
                                        <div className="font-medium">依存元素</div>
                                        <div className="text-sm opacity-80">承载源域材料</div>
                                        <div className="text-xs mt-1 opacity-60">（表语NP₂）</div>
                                    </div>
                                    <div className="bg-white/20 rounded-lg p-3">
                                        <div className="font-medium">自主元素</div>
                                        <div className="text-sm opacity-80">指示目标域概念</div>
                                        <div className="text-xs mt-1 opacity-60">（主语NP₁）</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        {/* 标签 */}
                        <div className="absolute -top-3 left-1/4 transform -translate-x-1/2">
                            <div className="bg-purple-500 text-white text-xs px-2 py-1 rounded-full">向上溯源</div>
                        </div>
                        <div className="absolute -top-3 right-1/4 transform translate-x-1/2">
                            <div className="bg-green-500 text-white text-xs px-2 py-1 rounded-full">向外扩展</div>
                        </div>
                    </div>
                    
                    {/* 第二层和第三层 */}
                    <div className="flex gap-4 mt-6 flex-wrap">
                        {/* Langacker层 */}
                        <div className="flex-1 min-w-64 bg-purple-100 border-2 border-purple-300 rounded-xl p-4">
                            <div className="text-center">
                                <div className="text-sm text-purple-600">第二层</div>
                                <div className="font-bold text-purple-800">Langacker 认知语法</div>
                                <div className="text-xs text-purple-600 mt-1">微观认知机制补充</div>
                            </div>
                            <div className="mt-3 space-y-2">
                                <div className="bg-white rounded p-2 text-sm">
                                    <span className="font-medium">认知域</span>
                                    <span className="text-gray-500 text-xs ml-1">→ 阶段1</span>
                                </div>
                                <div className="bg-white rounded p-2 text-sm">
                                    <span className="font-medium">认知参照点</span>
                                    <span className="text-gray-500 text-xs ml-1">→ 阶段2</span>
                                </div>
                                <div className="bg-white rounded p-2 text-sm">
                                    <span className="font-medium">自主-依存</span>
                                    <span className="text-gray-500 text-xs ml-1">→ 阶段3</span>
                                </div>
                                <div className="bg-white rounded p-2 text-sm">
                                    <span className="font-medium">语言编码</span>
                                    <span className="text-gray-500 text-xs ml-1">→ 阶段4</span>
                                </div>
                            </div>
                        </div>
                        
                        {/* Goldberg层 */}
                        <div className="flex-1 min-w-64 bg-green-100 border-2 border-green-300 rounded-xl p-4">
                            <div className="text-center">
                                <div className="text-sm text-green-600">第三层</div>
                                <div className="font-bold text-green-800">Goldberg 构式语法</div>
                                <div className="text-xs text-green-600 mt-1">宏观网络组织扩展</div>
                            </div>
                            <div className="mt-3 space-y-2">
                                <div className="bg-white rounded p-2 text-sm">
                                    <span className="font-medium">多义链接</span>
                                    <span className="text-gray-500 text-xs ml-1">Polysemy</span>
                                </div>
                                <div className="bg-white rounded p-2 text-sm">
                                    <span className="font-medium">隐喻扩展链接</span>
                                    <span className="text-gray-500 text-xs ml-1">Metaphor</span>
                                </div>
                                <div className="bg-white rounded p-2 text-sm">
                                    <span className="font-medium">子部分链接</span>
                                    <span className="text-gray-500 text-xs ml-1">Subpart</span>
                                </div>
                                <div className="bg-white rounded p-2 text-sm">
                                    <span className="font-medium">实例链接</span>
                                    <span className="text-gray-500 text-xs ml-1">Instance</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    {/* 汉语类型学适应 */}
                    <div className="mt-6 bg-orange-100 border-2 border-orange-300 rounded-xl p-4">
                        <div className="text-center">
                            <div className="text-sm text-orange-600">向内聚焦</div>
                            <div className="font-bold text-orange-800">汉语类型学特征</div>
                        </div>
                        <div className="mt-3 flex justify-center gap-4 flex-wrap">
                            <div className="bg-white rounded-lg p-3 text-center">
                                <div className="font-medium text-orange-700">核心系词"是"</div>
                                <div className="text-xs text-gray-500">主要研究对象</div>
                            </div>
                            <div className="bg-white rounded-lg p-3 text-center">
                                <div className="font-medium text-orange-700">零系词现象</div>
                                <div className="text-xs text-gray-500">探索性讨论</div>
                            </div>
                            <div className="bg-white rounded-lg p-3 text-center">
                                <div className="font-medium text-orange-700">主题突出特征</div>
                                <div className="text-xs text-gray-500">类型学视角</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        // 视图3: 四阶段认知编码机制
        const FourStagesMechanism = () => (
            <div className="p-6">
                <h2 className="text-xl font-bold text-center text-gray-800 mb-2">四阶段认知编码机制</h2>
                <p className="text-center text-gray-500 text-sm mb-6">具有逻辑依赖顺序的动态交互过程</p>
                
                <div className="max-w-4xl mx-auto">
                    {/* 四个阶段 - 响应式布局 */}
                    <div className="flex items-center justify-between flex-wrap gap-4">
                        {/* 阶段1 */}
                        <div className="flex flex-col items-center">
                            <div className="w-24 h-24 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white shadow-lg">
                                <div className="text-center">
                                    <div className="text-xl font-bold">η₁</div>
                                    <div className="text-xs">阶段1</div>
                                </div>
                            </div>
                            <div className="mt-3 text-center">
                                <div className="font-bold text-blue-700 text-sm">认知域激活</div>
                                <div className="text-xs text-gray-500 mt-1">源域与目标域的激活</div>
                            </div>
                        </div>
                        
                        {/* 箭头1 */}
                        <div className="flex flex-col items-center">
                            <span className="text-2xl text-gray-400">→</span>
                            <span className="text-xs text-gray-400">β₁</span>
                        </div>
                        
                        {/* 阶段2 */}
                        <div className="flex flex-col items-center">
                            <div className="w-24 h-24 rounded-full bg-gradient-to-br from-purple-400 to-purple-600 flex items-center justify-center text-white shadow-lg">
                                <div className="text-center">
                                    <div className="text-xl font-bold">η₂</div>
                                    <div className="text-xs">阶段2</div>
                                </div>
                            </div>
                            <div className="mt-3 text-center">
                                <div className="font-bold text-purple-700 text-sm">参照点锚定</div>
                                <div className="text-xs text-gray-500 mt-1">NP₁作为句法参照点</div>
                            </div>
                        </div>
                        
                        {/* 箭头2 */}
                        <div className="flex flex-col items-center">
                            <span className="text-2xl text-gray-400">→</span>
                            <span className="text-xs text-red-500 font-bold">β₂ (核心)</span>
                        </div>
                        
                        {/* 阶段3 */}
                        <div className="flex flex-col items-center">
                            <div className="w-24 h-24 rounded-full bg-gradient-to-br from-rose-400 to-rose-600 flex items-center justify-center text-white shadow-lg">
                                <div className="text-center">
                                    <div className="text-xl font-bold">η₃</div>
                                    <div className="text-xs">阶段3</div>
                                </div>
                            </div>
                            <div className="mt-3 text-center">
                                <div className="font-bold text-rose-700 text-sm">跨域映射</div>
                                <div className="text-xs text-gray-500 mt-1">Sullivan自主-依存原则</div>
                            </div>
                        </div>
                        
                        {/* 箭头3 */}
                        <div className="flex flex-col items-center">
                            <span className="text-2xl text-gray-400">→</span>
                            <span className="text-xs text-gray-400">γ</span>
                        </div>
                        
                        {/* 阶段4/输出 */}
                        <div className="flex flex-col items-center">
                            <div className="w-24 h-24 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-white shadow-lg">
                                <div className="text-center">
                                    <div className="text-xl font-bold">X₁₁</div>
                                    <div className="text-xs">输出</div>
                                </div>
                            </div>
                            <div className="mt-3 text-center">
                                <div className="font-bold text-amber-700 text-sm">语言编码</div>
                                <div className="text-xs text-gray-500 mt-1">系词功能选择</div>
                            </div>
                        </div>
                    </div>
                    
                    {/* 跨阶段直接效应 */}
                    <div className="mt-8 flex justify-center">
                        <div className="bg-gray-100 rounded-xl p-4 w-full max-w-xl">
                            <div className="text-center text-sm text-gray-600 mb-2">跨阶段直接效应（中介检验）</div>
                            <div className="flex justify-center items-center gap-2">
                                <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded text-sm">η₁</span>
                                <span className="text-gray-400">─ β₃ ─→</span>
                                <span className="bg-amber-100 text-amber-700 px-2 py-1 rounded text-sm">X₁₁</span>
                            </div>
                            <div className="text-center text-xs text-gray-500 mt-2">预期：部分中介效应（Bootstrap 5000次）</div>
                        </div>
                    </div>
                    
                    {/* 路径强度预期 */}
                    <div className="mt-6 bg-blue-50 rounded-xl p-4">
                        <div className="text-center text-sm font-medium text-blue-700 mb-3">路径强度预期</div>
                        <div className="flex justify-center items-center gap-4 text-sm flex-wrap">
                            <span className="font-bold text-rose-600">β₂ 最高</span>
                            <span className="text-gray-400">&gt;</span>
                            <span className="text-purple-600">γ ≈ β₁</span>
                            <span className="text-gray-400">&gt;</span>
                            <span className="text-gray-600">β₃</span>
                        </div>
                        <div className="text-center text-xs text-gray-500 mt-2">β₂最高体现Sullivan自主-依存原则的核心地位</div>
                    </div>
                </div>
            </div>
        );

        // 视图4: 双维度分类体系
        const DualDimensionSystem = () => (
            <div className="p-6">
                <h2 className="text-xl font-bold text-center text-gray-800 mb-6">双维度分类体系 → 12类构式</h2>
                
                <div className="max-w-3xl mx-auto">
                    {/* 维度说明 */}
                    <div className="flex gap-4 mb-6 flex-wrap">
                        <div className="flex-1 min-w-64 bg-blue-50 border border-blue-200 rounded-xl p-4">
                            <div className="font-bold text-blue-700 mb-2">维度1：认知通达度</div>
                            <div className="text-sm text-gray-600 mb-3">源域概念在认知系统中被激活的难易程度</div>
                            <div className="space-y-2">
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 rounded bg-green-400"></div>
                                    <span className="text-sm">高通达度 (High)</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 rounded bg-yellow-400"></div>
                                    <span className="text-sm">中通达度 (Medium)</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 rounded bg-red-400"></div>
                                    <span className="text-sm">低通达度 (Low)</span>
                                </div>
                            </div>
                        </div>
                        
                        <div className="flex-1 min-w-64 bg-purple-50 border border-purple-200 rounded-xl p-4">
                            <div className="font-bold text-purple-700 mb-2">维度2：概念复杂度（映射类型）</div>
                            <div className="text-sm text-gray-600 mb-3">目标域概念化所需的总体认知资源</div>
                            <div className="space-y-2">
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 rounded bg-blue-500"></div>
                                    <span className="text-sm">具体→抽象 (C→A)</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 rounded bg-indigo-500"></div>
                                    <span className="text-sm">抽象→抽象 (A→A)</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 rounded bg-teal-500"></div>
                                    <span className="text-sm">具体→具体 (C→C)</span>
                                </div>
                                <div className="flex items-center gap-2">

                    </div>
                    
                    {/* 12格矩阵 */}
                    <div className="bg-white rounded-xl border border-gray-200 overflow-x-auto">
                        <table className="w-full min-w-96">
                            <thead>
                                <tr className="bg-gray-50">
                                    <th className="p-3 border-b border-r text-left text-gray-600 w-24"></th>
                                    <th className="p-3 border-b border-r text-center text-blue-600 font-medium">C→A</th>
                                    <th className="p-3 border-b border-r text-center text-indigo-600 font-medium">A→A</th>
                                    <th className="p-3 border-b border-r text-center text-teal-600 font-medium">C→C</th>
                                    <th className="p-3 border-b text-center text-pink-600 font-medium">A→C</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td className="p-3 border-r bg-green-50 font-medium text-green-700">高通达</td>
                                    <td className="p-3 border-r text-center bg-green-50/50">
                                        <div className="font-bold">类型1</div>
                                        <div className="text-xs text-gray-500">原型中心</div>
                                    </td>
                                    <td className="p-3 border-r text-center">
                                        <div className="font-bold">类型2</div>
                                    </td>
                                    <td className="p-3 border-r text-center">
                                        <div className="font-bold">类型3</div>
                                    </td>
                                    <td className="p-3 text-center">
                                        <div className="font-bold">类型4</div>
                                    </td>
                                </tr>
                                <tr>
                                    <td className="p-3 border-r border-t bg-yellow-50 font-medium text-yellow-700">中通达</td>
                                    <td className="p-3 border-r border-t text-center">
                                        <div className="font-bold">类型5</div>
                                    </td>
                                    <td className="p-3 border-r border-t text-center">
                                        <div className="font-bold">类型6</div>
                                    </td>
                                    <td className="p-3 border-r border-t text-center">
                                        <div className="font-bold">类型7</div>
                                    </td>
                                    <td className="p-3 border-t text-center">
                                        <div className="font-bold">类型8</div>
                                    </td>
                                </tr>
                                <tr>
                                    <td className="p-3 border-r border-t bg-red-50 font-medium text-red-700">低通达</td>
                                    <td className="p-3 border-r border-t text-center">

                                    </td>
                                    <td className="p-3 border-r border-t text-center">
                                        <div className="font-bold">类型10</div>
                                    </td>
                                    <td className="p-3 border-r border-t text-center">
                                        <div className="font-bold">类型11</div>
                                    </td>
                                    <td className="p-3 border-t text-center bg-red-50/50">
                                        <div className="font-bold">类型12</div>
                                        <div className="text-xs text-gray-500">边缘</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    {/* 原型梯度 */}
                    <div className="mt-6 bg-gradient-to-r from-green-100 via-yellow-100 to-red-100 rounded-xl p-4">
                        <div className="text-center font-medium text-gray-700 mb-2">原型梯度结构</div>
                        <div className="flex items-center justify-between px-8">
                            <div className="text-center">
                                <div className="text-2xl">🎯</div>
                                <div className="text-sm font-medium text-green-700">原型中心</div>
                                <div className="text-xs text-gray-500">类型1</div>
                            </div>
                            <div className="flex-1 h-1 bg-gradient-to-r from-green-400 via-yellow-400 to-red-400 mx-4 rounded"></div>
                            <div className="text-center">
                                <div className="text-2xl">⭕</div>
                                <div className="text-sm font-medium text-red-700">边缘成员</div>
                                <div className="text-xs text-gray-500">类型12</div>
                            </div>
                        </div>
                    </div>
                    
                    {/* H1-1假设 */}
                    <div className="mt-4 bg-amber-50 border border-amber-200 rounded-xl p-4">
                        <div className="flex items-start gap-3">
                            <span className="text-amber-600 text-xl">✓</span>
                            <div>
                                <div className="font-medium text-amber-800">H1-1 认知分工原则</div>
                                <div className="text-sm text-amber-700">认知通达度与概念复杂度呈显著负相关（r ≈ -0.40至-0.60）</div>
                            </div>
                        </div>
                    </div>
                </div>

        );

        // 视图5: 假设-方法-验证对应
        const HypothesisMethodMap = () => (
            <div className="p-6">
                <h2 className="text-xl font-bold text-center text-gray-800 mb-6">假设-方法-验证对应图</h2>
                
                <div className="max-w-4xl mx-auto space-y-4">
                    {/* Q1 */}
                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="bg-amber-500 text-white font-bold rounded-lg px-3 py-1">Q1</div>
                            <div className="font-bold text-amber-800">类型体系</div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">假设</div>
                                <div className="font-medium">H1-1</div>
                                <div className="text-sm text-gray-600">认知通达度与概念复杂度负相关</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">方法</div>
                                <div className="font-medium">Spearman相关</div>
                                <div className="text-sm text-gray-600">回归分析</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">验证位置</div>
                                <div className="font-medium">5.1.4节</div>
                                <div className="text-sm text-gray-600">认知分工检验</div>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-3">
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">假设</div>
                                <div className="font-medium">H1-2</div>
                                <div className="text-sm text-gray-600">12类构式+原型梯度</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">方法</div>
                                <div className="font-medium">GMM聚类</div>
                                <div className="text-sm text-gray-600">LDA分类验证</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">验证位置</div>
                                <div className="font-medium">5.2节</div>
                                <div className="text-sm text-gray-600">构式识别与原型梯度</div>
                            </div>
                        </div>
                    </div>
                    
                    {/* Q2 */}
                    <div className="bg-teal-50 border border-teal-200 rounded-xl p-4">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="bg-teal-500 text-white font-bold rounded-lg px-3 py-1">Q2</div>
                            <div className="font-bold text-teal-800">网络组织</div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">假设</div>
                                <div className="font-medium">H2</div>
                                <div className="text-sm text-gray-600">小世界性质 + 四类链接构成拓扑</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">方法</div>
                                <div className="font-medium">网络分析</div>
                                <div className="text-sm text-gray-600">聚类系数/路径长度</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">验证位置</div>
                                <div className="font-medium">6.2-6.3节</div>
                                <div className="text-sm text-gray-600">小世界验证+链接分析</div>
                            </div>
                        </div>
                    </div>
                    
                    {/* Q3 */}
                    <div className="bg-rose-50 border border-rose-200 rounded-xl p-4">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="bg-rose-500 text-white font-bold rounded-lg px-3 py-1">Q3</div>
                            <div className="font-bold text-rose-800">认知机制</div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">假设</div>
                                <div className="font-medium">H3-1</div>
                                <div className="text-sm text-gray-600">四阶段机制验证 + 跨类型共享</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">方法</div>
                                <div className="font-medium">SEM</div>
                                <div className="text-sm text-gray-600">多组不变性检验</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">验证位置</div>
                                <div className="font-medium">7.1-7.2节</div>
                                <div className="text-sm text-gray-600">机制存在性+共享性</div>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-3">
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">假设</div>
                                <div className="font-medium">H3-2</div>
                                <div className="text-sm text-gray-600">双维度与四阶段系统性关联</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">方法</div>
                                <div className="font-medium">相关+ANOVA</div>
                                <div className="text-sm text-gray-600">Pearson相关+Tukey HSD</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="text-xs text-gray-500 mb-1">验证位置</div>
                                <div className="font-medium">7.4节</div>
                                <div className="text-sm text-gray-600">双维度与四阶段关联</div>
                            </div>
                        </div>
                    </div>
                    
                    {/* 探索性分析 */}
                    <div className="bg-gray-50 border border-gray-200 rounded-xl p-4">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="bg-gray-500 text-white font-bold rounded-lg px-3 py-1">探索性</div>
                            <div className="font-bold text-gray-700">非假设验证内容</div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-white rounded-lg p-3">
                                <div className="font-medium text-gray-700">12类构式编码差异</div>
                                <div className="text-sm text-gray-500">7.3节 探索性分析</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="font-medium text-gray-700">汉语认知特色调节</div>
                                <div className="text-sm text-gray-500">7.5节 探索性分析</div>
                            </div>
                            <div className="bg-white rounded-lg p-3">
                                <div className="font-medium text-gray-700">零系词现象</div>
                                <div className="text-sm text-gray-500">7.6节 探索性讨论（定性）</div>
                            </div>

                </div>
            </div>
        );

        // 视图6: 章节结构与字数分配
        const ChapterStructure = () => {
            const chapters = [
                { ch: 1, title: '绪论', words: 13796, color: 'blue', func: '问题提出' },
                { ch: 2, title: '文献综述', words: 39845, color: 'blue', func: '综述+批判' },
                { ch: 3, title: '理论框架', words: 26028, color: 'blue', func: '框架构建' },
                { ch: 4, title: '研究设计与方法', words: 15906, color: 'blue', func: '方法设计' },
                { ch: 5, title: '类型体系分析（Q1）', words: 26046, color: 'green', func: 'H1-1/H1-2验证' },
                { ch: 6, title: '网络组织分析（Q2）', words: 23039, color: 'green', func: 'H2验证' },
                { ch: 7, title: '认知编码机制分析（Q3）', words: 32795, color: 'green', func: 'H3-1/H3-2验证' },
                { ch: 8, title: '综合讨论', words: 15416, color: 'purple', func: '发现整合' },
                { ch: 9, title: '结论', words: 4253, color: 'purple', func: '收束' },
            ];
            
            const colorMap = {
                blue: { bg: 'bg-blue-100', text: 'text-blue-700', bar: 'bg-blue-400' },
                green: { bg: 'bg-green-100', text: 'text-green-700', bar: 'bg-green-400' },
                purple: { bg: 'bg-purple-100', text: 'text-purple-700', bar: 'bg-purple-400' }
            };
            
            return (
                <div className="p-6">
                    <h2 className="text-xl font-bold text-center text-gray-800 mb-6">章节结构与字数分配</h2>
                    
                    <div className="max-w-3xl mx-auto">
                        {/* 三部分概览 */}
                        <div className="grid grid-cols-3 gap-4 mb-6">
                            <div className="bg-blue-100 rounded-xl p-4 text-center">
                                <div className="text-3xl font-bold text-blue-700">48.5%</div>
                                <div className="font-medium text-blue-800 mt-1">第一部分</div>
                                <div className="text-sm text-blue-600">理论建构</div>
                                <div className="text-xs text-gray-500 mt-2">第1-4章 · 95,575字</div>
                            </div>
                            <div className="bg-green-100 rounded-xl p-4 text-center">
                                <div className="text-3xl font-bold text-green-700">41.5%</div>
                                <div className="font-medium text-green-800 mt-1">第二部分</div>
                                <div className="text-sm text-green-600">实证分析</div>
                                <div className="text-xs text-gray-500 mt-2">第5-7章 · 81,880字</div>
                            </div>
                            <div className="bg-purple-100 rounded-xl p-4 text-center">
                                <div className="text-3xl font-bold text-purple-700">10.0%</div>
                                <div className="font-medium text-purple-800 mt-1">第三部分</div>
                                <div className="text-sm text-purple-600">综合讨论</div>
                                <div className="text-xs text-gray-500 mt-2">第8-9章 · 19,669字</div>
                            </div>
                        </div>
                        
                        {/* 章节详情 */}
                        <div className="space-y-2">
                            {chapters.map(item => (
                                <div key={item.ch} className="flex items-center gap-3">
                                    <div className={`w-12 h-12 rounded-lg ${colorMap[item.color].bg} flex items-center justify-center font-bold ${colorMap[item.color].text}`}>
                                        {item.ch}
                                    </div>
                                    <div className="flex-1">
                                        <div className="flex items-center justify-between">
                                            <span className="font-medium">{item.title}</span>
                                            <span className="text-sm text-gray-500">{item.words.toLocaleString()}字</span>
                                        </div>
                                        <div className="flex items-center gap-2 mt-1">
                                            <div className="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
                                                <div 
                                                    className={`h-full ${colorMap[item.color].bar}`}
                                                    style={{ width: `${(item.words / 40000) * 100}%` }}
                                                />
                                            </div>
                                            <span className="text-xs text-gray-400 w-24">{item.func}</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        {/* 总计 */}
                        <div className="mt-6 bg-gray-100 rounded-xl p-4 text-center">
                            <div className="text-2xl font-bold text-gray-700">总计 197,124 字</div>
                            <div className="text-sm text-gray-500">实际统计字数（2025-12-21）</div>
                        </div>
                    </div>
                </div>
            );
        };

        // 主组件
        function App() {
            const [activeTab, setActiveTab] = useState('overall');
            
            const tabs = [
                { id: 'overall', label: '整体架构' },
                { id: 'cfmc', label: 'CFMC框架' },
                { id: 'stages', label: '四阶段机制' },
                { id: 'dual', label: '双维度分类' },
                { id: 'hypothesis', label: '假设-方法' },
                { id: 'chapters', label: '章节结构' },
            ];
            
            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">
                    {/* Header */}
                    <div className="bg-white border-b border-gray-200 sticky top-0 z-10">
                        <div className="max-w-5xl mx-auto px-6 py-4">
                            <h1 className="text-xl font-bold text-gray-800 text-center mb-4">
                                基于语料库的汉语系表隐喻构式网络认知机制研究
                            </h1>
                            <div className="flex flex-wrap justify-center gap-2">
                                {tabs.map(tab => (
                                    <TabButton
                                        key={tab.id}
                                        active={activeTab === tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                    >
                                        {tab.label}
                                    </TabButton>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    {/* Content */}
                    <div className="max-w-5xl mx-auto">
                        {activeTab === 'overall' && <OverallFlowchart />}
                        {activeTab === 'cfmc' && <CFMCStructure />}
                        {activeTab === 'stages' && <FourStagesMechanism />}
                        {activeTab === 'dual' && <DualDimensionSystem />}
                        {activeTab === 'hypothesis' && <HypothesisMethodMap />}
                        {activeTab === 'chapters' && <ChapterStructure />}
                    </div>
                    
                    {/* Footer */}
                    <div className="text-center py-6 text-sm text-gray-500">
                        博士论文研究架构可视化 · CFMC框架
                    </div>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
